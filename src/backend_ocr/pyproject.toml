[project]
name = "helpyourself-backend-ocr"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.136.3",
    "httpx==0.28.1",
    "pillow==11.3.0",
    "pydantic==2.12.5",
    "uvicorn==0.35.0",
]

[dependency-groups]
dev = ["black==26.1.0", "isort==8.0.1"]

[tool.uv]
package = false

[tool.black]
line-length = 120
skip-string-normalization = true
skip-magic-trailing-comma = true

[tool.isort]
profile = "black"
line_length = 120
