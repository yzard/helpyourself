[server]
listen = "127.0.0.1:8080"

[security]
session_ttl_seconds = 86400
login_window_seconds = 300
login_attempts_per_window = 10
maximum_password_checks = 2

[storage]
maximum_upload_bytes = 20971520
maximum_pdf_pages = 100
maximum_image_pixels = 40000000

[jobs]
lease_seconds = 120
maximum_attempts = 3

# Enable only after configuring and testing your own model endpoints.
# Configure these centrally; clients cannot override them.
[ocr]
enabled = false
url = "http://127.0.0.1:8001"
timeout_seconds = 660
api_key = "" # Set the shared OCR key here; playground initialization generates it.

[providers.analysis]
enabled = false
base_url = "http://127.0.0.1:8002/v1"
model = "configure-your-model"
adapter = "openai_chat"
api_key = "" # Empty only for a provider that needs no authentication.
timeout_seconds = 120
