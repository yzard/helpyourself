services:
  backend_api:
    image: helpyourself-backend-api:local
    build:
      context: ..
      dockerfile: docker/backend_api.Dockerfile
    restart: unless-stopped
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      UMASK: "077"
      TZ: "${TZ:-UTC}"
    volumes:
      - ${HELPYOURSELF_CONFIG:-./config.toml}:/config/config.toml:ro
      - ${HELPYOURSELF_DATA_DIR:-helpyourself-data}:/data
      - ${HELPYOURSELF_OCR_KEY_FILE:-../playground/secrets/ocr-key}:/secrets/ocr-key:ro
    expose: ["8080"]
    networks: [ingress, inference]
    stop_grace_period: 30s
  backend_ocr:
    image: helpyourself-backend-ocr:local
    build:
      context: ..
      dockerfile: docker/backend_ocr.Dockerfile
    restart: unless-stopped
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      UMASK: "077"
      TZ: "${TZ:-UTC}"
    volumes:
      - ${HELPYOURSELF_OCR_CONFIG:-../src/backend_ocr/config.toml}:/config/config.toml:ro
      - ${HELPYOURSELF_OCR_KEY_FILE:-../playground/secrets/ocr-key}:/secrets/ocr-key:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${HELPYOURSELF_GPU_DEVICE:-0}"]
              capabilities: [gpu]
    expose: ["8000"]
    networks: [inference]
    stop_grace_period: 30s
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      HELPYOURSELF_DOMAIN: "${HELPYOURSELF_DOMAIN:-localhost}"
    ports:
      - "${HELPYOURSELF_BIND_ADDRESS:-0.0.0.0}:${HELPYOURSELF_HTTP_PORT:-80}:80"
      - "${HELPYOURSELF_BIND_ADDRESS:-0.0.0.0}:${HELPYOURSELF_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [ingress]
    depends_on: [backend_api]
networks:
  ingress:
  inference:
    internal: true
volumes:
  helpyourself-data:
  caddy-data:
  caddy-config:
